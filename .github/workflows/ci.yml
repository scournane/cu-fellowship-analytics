# The tests exist; until now nothing ran them except a person remembering to.
#
# That is how `test_cron_tick_runs_with_the_right_token` came to pass on the
# machine that wrote it and fail everywhere else (finding F-13: the suite builds
# its Settings from the process environment, so a developer's own .env decides
# the result). A clean checkout is the only honest place to run this, and that
# is exactly what a runner is.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Port 64322 rather than 5432: that is what the local Supabase stack
    # listens on, so conftest's default DSN needs no override and CI exercises
    # the same connection string a contributor does.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 64322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Create the test database and apply every migration
        run: python scripts/make_test_db.py

      # No CUFA_* variables are set here on purpose. The suite must pass with
      # nothing but the database configured; anything that needs more is
      # reading the environment it should be pinning itself (F-13).
      - name: Run the suite
        run: python -m pytest tests/ -q -p no:randomly

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The built theme is committed, so it can go stale against its source.
      # `--check` is what `python tasks.py frontend` runs; failing here is the
      # difference between finding out now and finding out in a screenshot.
      - name: The committed theme matches its source
        working-directory: frontend
        run: npm run theme -- --check

      - name: Build the console bundle
        working-directory: frontend
        run: npm run build
